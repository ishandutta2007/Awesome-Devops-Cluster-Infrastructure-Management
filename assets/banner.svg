<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(6px); }
    }
    @keyframes pulseNode {
      0%, 100% { r: 5px; opacity: 0.8; }
      50% { r: 8px; opacity: 1; }
    }

    .bg-orb-1 { animation: pulse 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .bg-orb-2 { animation: pulse 10s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
    .network-line { stroke-dasharray: 6 6; animation: dashMove 15s linear infinite; }
    .particle { animation: floatParticle 6s ease-in-out infinite; }
    .pulse-dot { animation: pulseNode 3s ease-in-out infinite; }
    
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Animated Glowing Mesh Orbs (strictly background) -->
  <circle class="bg-orb-1" cx="200" cy="120" r="220" fill="url(#glow-cyan)" filter="url(#blur-glow)" />
  <circle class="bg-orb-2" cx="1000" cy="280" r="240" fill="url(#glow-purple)" filter="url(#blur-glow)" />

  <!-- Tech Grid Pattern -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Constellation / Cluster Infrastructure Diagram (Background) -->
  <g opacity="0.45">
    <!-- Connecting Edges -->
    <line x1="120" y1="80" x2="260" y2="160" stroke="#38bdf8" stroke-width="1.5" class="network-line" />
    <line x1="260" y1="160" x2="160" y2="300" stroke="#818cf8" stroke-width="1.5" class="network-line" />
    <line x1="160" y1="300" x2="320" y2="350" stroke="#6366f1" stroke-width="1.5" />
    <line x1="260" y1="160" x2="420" y2="120" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    
    <line x1="1080" y1="90" x2="950" y2="170" stroke="#a855f7" stroke-width="1.5" class="network-line" />
    <line x1="950" y1="170" x2="1050" y2="310" stroke="#ec4899" stroke-width="1.5" class="network-line" />
    <line x1="950" y1="170" x2="800" y2="140" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="1050" y1="310" x2="920" y2="360" stroke="#c084fc" stroke-width="1.5" />

    <!-- Nodes with glowing rings -->
    <circle cx="120" cy="80" r="4" fill="#38bdf8" />
    <circle cx="260" cy="160" r="6" fill="#38bdf8" filter="url(#node-glow)" class="pulse-dot" />
    <circle cx="160" cy="300" r="5" fill="#818cf8" />
    <circle cx="320" cy="350" r="4" fill="#6366f1" />
    <circle cx="420" cy="120" r="3.5" fill="#38bdf8" />

    <circle cx="1080" cy="90" r="4" fill="#a855f7" />
    <circle cx="950" cy="170" r="6" fill="#c084fc" filter="url(#node-glow)" class="pulse-dot" style="animation-delay: 1.5s;" />
    <circle cx="1050" cy="310" r="5" fill="#ec4899" />
    <circle cx="920" cy="360" r="4" fill="#a855f7" />
    <circle cx="800" cy="140" r="3.5" fill="#c084fc" />
  </g>

  <!-- Floating Ambient Cluster Particles -->
  <g class="particle" opacity="0.7">
    <circle cx="210" cy="220" r="2" fill="#38bdf8" />
    <circle cx="990" cy="120" r="2.5" fill="#c084fc" />
    <circle cx="150" cy="160" r="1.5" fill="#67e8f9" />
    <circle cx="1060" cy="230" r="2" fill="#f472b6" />
  </g>

  <!-- FOREGROUND: Content Card & Headers (Always crisp, prominent, unobstructed) -->
  <g transform="translate(600, 210)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, -115)">
      <rect x="-190" y="-18" width="380" height="36" rx="18" fill="url(#badge-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="-160" cy="0" r="5" fill="#10b981" />
      <text x="-142" y="5" fill="#93c5fd" font-size="13" font-weight="600" letter-spacing="0.08em" class="sub-text" text-anchor="start">
        PRODUCTION INFRASTRUCTURE &amp; CLUSTERS
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="-35" text-anchor="middle" font-size="44" fill="url(#primary-grad)" class="title-text">
      Awesome DevOps &amp; Cluster Management
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="10" text-anchor="middle" font-size="18" fill="#e2e8f0" font-weight="500" class="sub-text">
      Curated Fleet of Multi-Cluster Kubernetes, Bare-Metal, Hybrid Cloud &amp; Declarative IaC
    </text>

    <!-- Highlight Meta Pills -->
    <g transform="translate(0, 65)">
      <!-- Pill 1: Kubernetes -->
      <g transform="translate(-250, 0)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" font-size="12" fill="#38bdf8" font-weight="600" class="sub-text">☸️ Kubernetes &amp; Fleet</text>
      </g>
      <!-- Pill 2: Bare Metal & HCI -->
      <g transform="translate(-75, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" font-size="12" fill="#818cf8" font-weight="600" class="sub-text">🖥️ Bare-Metal &amp; HCI</text>
      </g>
      <!-- Pill 3: GitOps & Declarative IaC -->
      <g transform="translate(95, 0)">
        <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" font-size="12" fill="#c084fc" font-weight="600" class="sub-text">⚙️ GitOps &amp; IaC</text>
      </g>
      <!-- Pill 4: SRE & Observability -->
      <g transform="translate(260, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" font-size="12" fill="#34d399" font-weight="600" class="sub-text">📊 SRE &amp; FinOps</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primary-grad)" />
</svg>